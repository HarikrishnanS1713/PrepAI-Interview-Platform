<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Aptitude Test – PrepAI</title>
  <link rel="stylesheet" href="../css/style.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
</head>
<body>
<div class="dashboard-layout">
  <aside class="sidebar">
    <div class="sidebar-logo">⬡ PrepAI</div>
    <nav class="sidebar-nav">
      <a href="dashboard.html"><i class="fas fa-th-large"></i> Dashboard</a>
      <a href="mock-interview.html"><i class="fas fa-comments"></i> Mock Interview</a>
      <a href="technical-quiz.html"><i class="fas fa-code"></i> Technical Quiz</a>
      <a href="aptitude-test.html" class="active"><i class="fas fa-calculator"></i> Aptitude Test</a>
      <a href="hr-prep.html"><i class="fas fa-users"></i> HR Prep</a>
      <a href="performance.html"><i class="fas fa-chart-line"></i> Performance</a>
      <a href="history.html"><i class="fas fa-history"></i> History</a>
    </nav>
    <div class="sidebar-bottom">
      <a href="../index.html" style="font-size:0.82rem;color:var(--text-muted);text-align:center;display:block;"><i class="fas fa-sign-out-alt"></i> Logout</a>
    </div>
  </aside>

  <main class="main-content">
    <div class="page-header">
      <h1>Aptitude Test</h1>
      <p>Practice quantitative, logical reasoning, and verbal ability questions.</p>
    </div>

    <div class="card" id="aptSetup">
      <div class="card-header"><span class="card-title">Test Configuration</span></div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px;">
        <div class="form-group">
          <label>Test Type</label>
          <select id="aptType">
            <option value="quant">Quantitative Aptitude</option>
            <option value="logical">Logical Reasoning</option>
            <option value="verbal">Verbal Ability</option>
            <option value="mixed">Mixed Aptitude</option>
          </select>
        </div>
        <div class="form-group">
          <label>Total Questions</label>
          <select id="aptCount">
            <option value="10" selected>10</option>
            <option value="15">15</option>
            <option value="20">20</option>
          </select>
        </div>
      </div>
      <button class="btn-primary" onclick="startApt()"><i class="fas fa-play"></i> Start Test</button>
    </div>

    <div id="aptPanel" style="display:none;">
      <div class="card" style="margin-bottom:16px;">
        <div style="display:flex;justify-content:space-between;align-items:center;">
          <span style="font-size:0.85rem;color:var(--text-muted);">Q <span id="aptQNum">1</span>/<span id="aptQTotal">10</span></span>
          <div class="timer-display"><i class="fas fa-clock"></i> <span id="aptTimer">90</span>s</div>
        </div>
        <div class="progress-bar-wrap" style="margin-top:10px;">
          <div class="progress-bar-fill" id="aptProgress" style="width:5%;"></div>
        </div>
      </div>
      <div class="interview-session">
        <div id="aptQuestion" class="question-content" style="margin-bottom:24px;line-height:1.8;"></div>
        <div class="quiz-options" id="aptOptions"></div>
        <div id="aptExp" style="display:none;background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:16px;font-size:0.88rem;color:var(--text-muted);line-height:1.7;margin-bottom:16px;"></div>
        <button class="btn-primary" id="aptNextBtn" onclick="nextApt()" style="display:none;">Next →</button>
      </div>
    </div>

    <div class="card" id="aptResults" style="display:none;">
      <div style="text-align:center;padding:24px 0;">
        <div style="font-size:3rem;margin-bottom:12px;">📊</div>
        <h2 style="font-family:var(--font-display);margin-bottom:20px;">Test Complete!</h2>
        <div class="feedback-scores" style="justify-content:center;" id="aptResultScores"></div>
        <div style="margin-top:24px;display:flex;gap:12px;justify-content:center;">
          <button class="btn-primary" onclick="location.reload()">Retake Test</button>
          <a href="performance.html"><button class="btn-secondary">Analytics</button></a>
        </div>
      </div>
    </div>
  </main>
</div>
<script src="../js/aptitude-test.js"></script>
</body>
</html>
