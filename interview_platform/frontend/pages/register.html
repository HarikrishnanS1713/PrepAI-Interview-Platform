<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Register – PrepAI</title>
  <link rel="stylesheet" href="../css/style.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
</head>
<body class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">⬡ PrepAI</div>
    <p class="auth-subtitle">Create your free account and start preparing today.</p>
    <div id="alertBox"></div>
    <form id="registerForm">
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" id="fullname" placeholder="Riya Sharma" required/>
      </div>
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" id="email" placeholder="you@example.com" required/>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" placeholder="Min. 8 characters" required/>
      </div>
      <div class="form-group">
        <label>Target Domain</label>
        <select id="domain">
          <option value="">Select a domain</option>
          <option value="programming">Programming / Software Engineering</option>
          <option value="data_science">Data Science / ML</option>
          <option value="networking">Networking / Systems</option>
          <option value="management">Management / MBA</option>
          <option value="general">General / HR</option>
        </select>
      </div>
      <div class="form-group">
        <label>Experience Level</label>
        <select id="experience">
          <option value="fresher">Fresher (0–1 year)</option>
          <option value="junior">Junior (1–3 years)</option>
          <option value="mid">Mid-level (3–6 years)</option>
          <option value="senior">Senior (6+ years)</option>
        </select>
      </div>
      <button type="submit" class="btn-full">Create Account</button>
    </form>
    <div class="auth-switch">
      Already have an account? <a href="login.html">Log in</a>
    </div>
    <div class="auth-switch" style="margin-top:8px;">
      <a href="../index.html" style="color:var(--text-muted);font-size:0.82rem;">← Back to Home</a>
    </div>
  </div>
  <script src="../js/auth.js"></script>
</body>
</html>
